packages:
  - "apps/*"
  - "packages/*"
  - "!packages/wrelik-*"
  - "tooling/*"

# pnpm 10 runs only reviewed dependency lifecycle scripts. These packages
# prepare native binaries, Prisma engines, or build/release tooling.
onlyBuiltDependencies:
  - "@prisma/engines"
  - "@sentry/cli"
  - "@tailwindcss/oxide"
  - "bufferutil"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
  - "utf-8-validate"

# These reviewed hooks print notices; they do not prepare runtime artifacts.
ignoredBuiltDependencies:
  - "@clerk/shared"
  - "browser-tabs-lock"
  - "core-js"
  - "protobufjs"
