name: Deploy to Production

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production deployment dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production deployment configuration
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_PRODUCTION: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
        run: |
          set -euo pipefail
          for variable in \
            CONVEX_DEPLOY_KEY \
            VERCEL_TOKEN \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID_PRODUCTION \
            VERCEL_SCOPE
          do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required production configuration: $variable" >&2
              exit 1
            fi
          done

      - name: Deploy Convex functions to Production
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        working-directory: ./apps/app
        run: pnpm convex:deploy

      - name: Deploy production to Vercel
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
          scope: ${{ secrets.VERCEL_SCOPE }}
          working-directory: ./apps/app
          vercel-args: --prod
      - name: Smoke test production health endpoint
        run: |
          set -euo pipefail
          HEALTH_URL="${{ secrets.PRODUCTION_HEALTHCHECK_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="${{ steps.vercel.outputs.preview-url }}/api/health"
          fi
          if [[ "$HEALTH_URL" != http://* && "$HEALTH_URL" != https://* ]]; then
            HEALTH_URL="https://$HEALTH_URL"
          fi
          curl -fsSL "$HEALTH_URL"
