name: Sentry Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sentry token
        id: sentry_token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "SENTRY_AUTH_TOKEN is not set; skipping Sentry release workflow."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.sentry_token.outputs.has_token == 'true'
        with:
          fetch-depth: 0

      - name: Install pnpm
        if: steps.sentry_token.outputs.has_token == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        if: steps.sentry_token.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: "pnpm"

      - name: Install dependencies
        if: steps.sentry_token.outputs.has_token == 'true'
        run: pnpm install

      - name: Build (Upload Source Maps)
        if: steps.sentry_token.outputs.has_token == 'true'
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: wrelik-0y
          SENTRY_PROJECT: deelrx
          # Add build-time env vars if necessary (e.g. for static generation)
          # NEXT_PUBLIC_...

      - name: Create Sentry Release
        if: steps.sentry_token.outputs.has_token == 'true'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: wrelik-0y
          SENTRY_PROJECT: deelrx
        with:
          environment: production
          finalize: true
