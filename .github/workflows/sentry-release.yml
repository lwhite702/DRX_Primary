name: Sentry Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if Sentry auth token is configured
    if: secrets.SENTRY_AUTH_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build (Upload Source Maps)
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: wrelik-0y
          SENTRY_PROJECT: deelrx
          # Add build-time env vars if necessary (e.g. for static generation)
          # NEXT_PUBLIC_...

      - name: Create Sentry Release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: wrelik-0y
          SENTRY_PROJECT: deelrx
        with:
          environment: production
          finalize: true
