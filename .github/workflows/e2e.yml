name: End-to-End Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:admin@127.0.0.1:54322/postgres"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Supabase project config
        run: |
          mkdir -p supabase
          echo '[api]
          enabled = true
          port = 54321
          [db]
          port = 54322
          [studio]
          enabled = true
          port = 54323' > supabase/config.toml

      - name: Start Supabase
        run: |
          set -euo pipefail

          # Start required local services and wait until the stack is healthy.
          supabase start -x realtime,storage-api,studio,imgproxy,edge-runtime
          supabase status

          # Ensure API/Auth endpoint is reachable before launching tests.
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:54321/auth/v1/health" >/dev/null; then
              echo "Supabase auth endpoint is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Supabase auth endpoint did not become healthy in time" >&2
              supabase status || true
              exit 1
            fi
            sleep 2
          done
        env:
          SUPABASE_DB_PASSWORD: "admin"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          NODE_ENV: development
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IjEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY2MjMyODMyMCwiZXhwIjoxOTc3OTAyMzIwfQ.s_fd0Q-qQV5_Ikh_I_w_w"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IjEiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjYyMzI4MzIwLCJleHAiOjE5Nzc5MDIzMjB9.s_fd0Q-qQV5_Ikh_I_w_w"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
