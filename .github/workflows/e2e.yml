name: End-to-End Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read
  id-token: write

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Classify complete PR diff
        id: scope
        run: node scripts/testing/ci-change-scope.mjs

  e2e:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Setup Supabase project config
        run: |
          mkdir -p supabase
          echo '[api]
          enabled = true
          port = 54321
          [db]
          port = 54322
          [studio]
          enabled = true
          port = 54323' > supabase/config.toml

      - name: Start Supabase
        run: |
          set -euo pipefail

          # Start required local services and wait until the stack is healthy.
          supabase start -x realtime,storage-api,studio,imgproxy,edge-runtime
          supabase status

          # Ensure API/Auth endpoint is reachable before launching tests.
          for i in $(seq 1 30); do
            if curl --silent --show-error --fail "http://127.0.0.1:54321/auth/v1/health" >/dev/null; then
              echo "Supabase auth endpoint is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Supabase auth endpoint did not become healthy in time" >&2
              supabase status || true
              exit 1
            fi
            sleep 2
          done
      - name: Apply Prisma schema
        run: pnpm --filter deelrxcrm-app exec prisma db push --schema prisma/schema.prisma
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Wait for Vercel deployment
        uses: endformdev/actions/run-with-vercel-deployment@main
        with:
          project-name: drx-app
          set-url-env-var: BASE_URL

      - name: Run E2E tests with Endform
        working-directory: apps/app
        run: npx endform@latest test
        env:
          CI: true
          NODE_ENV: development
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IjEiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTY2MjMyODMyMCwiZXhwIjoxOTc3OTAyMzIwfQ.s_fd0Q-qQV5_Ikh_I_w_w"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IjEiLCJyb2xlIjoic2VydmljZV9yb2xlIiwiaWF0IjoxNjYyMzI4MzIwLCJleHAiOjE5Nzc5MDIzMjB9.s_fd0Q-qQV5_Ikh_I_w_w"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          retention-days: 7
