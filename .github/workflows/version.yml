name: Version Check

permissions:
  contents: read
  issues: write

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  version-check:
    name: Check Version Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Check version suggestion
        id: version_check
        run: |
          pnpm version:check > version_output.txt 2>&1 || true
          cat version_output.txt

      - name: Comment on PR (if applicable)
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('version_output.txt', 'utf8');
            } catch (error) {
              output = 'No version check output available.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Version Check\n\n\`\`\`\n${output}\n\`\`\``
            });
