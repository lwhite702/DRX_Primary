name: Version Check

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

jobs:
  version-check:
    name: Check Version Consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Check version consistency
        id: version_check
        run: |
          node <<'EOF' > version_output.txt
          const fs = require("fs");
          const path = require("path");

          function readVersion(filePath) {
            const raw = fs.readFileSync(filePath, "utf8");
            return JSON.parse(raw).version;
          }

          const rootPkgPath = path.join(process.cwd(), "package.json");
          const appPkgPath = path.join(process.cwd(), "apps", "app", "package.json");
          const versionFilePath = path.join(process.cwd(), "VERSION");

          const rootVersion = readVersion(rootPkgPath);
          const appVersion = readVersion(appPkgPath);
          const versionFile = fs.existsSync(versionFilePath)
            ? fs.readFileSync(versionFilePath, "utf8").trim()
            : null;

          const mismatches = [];
          if (rootVersion !== appVersion) {
            mismatches.push(`root package.json (${rootVersion}) != apps/app/package.json (${appVersion})`);
          }
          if (versionFile && versionFile !== rootVersion) {
            mismatches.push(`VERSION (${versionFile}) != root package.json (${rootVersion})`);
          }

          console.log(`root package.json version: ${rootVersion}`);
          console.log(`apps/app/package.json version: ${appVersion}`);
          console.log(`VERSION file: ${versionFile ?? "(missing)"}`);

          if (mismatches.length > 0) {
            console.log("");
            console.log("Version mismatch detected:");
            for (const mismatch of mismatches) {
              console.log(`- ${mismatch}`);
            }
            process.exit(1);
          }

          console.log("");
          console.log("Version consistency check passed.");
          EOF
          cat version_output.txt

      - name: Comment on PR (if applicable)
        continue-on-error: true
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('version_output.txt', 'utf8');
            } catch (error) {
              output = 'No version check output available.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Version Check\n\n\`\`\`\n${output}\n\`\`\``
            });
