name: iOS CI

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
  push:
    branches:
      - main
      - "feat/native-ios-foundation"
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and publish native iOS
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE_PATH=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          test -d DRXApp.xcodeproj
          xcodebuild -project DRXApp.xcodeproj -list

      - name: Resolve simulator
        id: simulator
        run: |
          set -euo pipefail
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = []
          fallback = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if not device.get("isAvailable"):
                      continue
                  name = device.get("name", "")
                  udid = device.get("udid")
                  if not udid or "iPhone" not in name:
                      continue
                  fallback.append((runtime, name, udid))
                  if "Pro" in name:
                      preferred.append((runtime, name, udid))
          candidates = preferred or fallback
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          candidates.sort(reverse=True)
          print(candidates[0][2])
          ')
          echo "udid=$SIMULATOR_UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          open -a Simulator || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project DRXApp.xcodeproj \
            -scheme DRXApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Run unit and UI tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project DRXApp.xcodeproj \
            -scheme DRXApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/DRXAppTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package simulator app
        id: package
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator" \
            -maxdepth 1 -type d -name '*.app' | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Simulator .app bundle was not found" >&2
            exit 1
          fi

          PACKAGE_PATH="$RUNNER_TEMP/DRXApp-simulator-${GITHUB_SHA::7}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$PACKAGE_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "package_path=$PACKAGE_PATH" >> "$GITHUB_OUTPUT"
          echo "package_name=$(basename "$PACKAGE_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$PACKAGE_PATH"

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DRXApp-simulator-${{ github.run_id }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload simulator build to Appetize
        id: appetize
        if: >-
          ${{
            success() &&
            env.APPETIZE_API_TOKEN != '' &&
            (github.event_name != 'pull_request' ||
             github.event.pull_request.head.repo.full_name == github.repository)
          }}
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          set -euo pipefail

          if [ -n "${APPETIZE_PUBLIC_KEY:-}" ]; then
            ENDPOINT="https://api.appetize.io/v1/apps/${APPETIZE_PUBLIC_KEY}"
            ACTION="updated"
          else
            ENDPOINT="https://api.appetize.io/v1/apps"
            ACTION="created"
          fi

          RESPONSE_FILE="$RUNNER_TEMP/appetize-response.json"
          HTTP_STATUS=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --request POST "$ENDPOINT" \
            --header "X-API-KEY: $APPETIZE_API_TOKEN" \
            --form "file=@${PACKAGE_PATH}" \
            --form "platform=ios" \
            --form "note=DRX ${GITHUB_REF_NAME} ${GITHUB_SHA::7} run ${GITHUB_RUN_NUMBER}" \
            --form "appPermissions.run=authenticated")

          cat "$RESPONSE_FILE"
          echo

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Appetize upload failed with HTTP $HTTP_STATUS" >&2
            exit 1
          fi

          PUBLIC_KEY=$(python3 - "$RESPONSE_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              payload = json.load(handle)
          print(payload.get("publicKey", ""))
          PY
          )

          if [ -z "$PUBLIC_KEY" ]; then
            echo "Appetize response did not include a publicKey" >&2
            exit 1
          fi

          APP_URL="https://appetize.io/app/${PUBLIC_KEY}"
          echo "public_key=$PUBLIC_KEY" >> "$GITHUB_OUTPUT"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Appetize app $ACTION: $APP_URL"

          {
            echo "## Appetize Simulator Build"
            echo
            echo "- Status: $ACTION"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Launch: $APP_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped Appetize upload
        if: >-
          ${{
            success() &&
            (env.APPETIZE_API_TOKEN == '' ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name != github.repository))
          }}
        run: |
          {
            echo "## Appetize Simulator Build"
            echo
            echo "Upload skipped. Configure the repository secret \`APPETIZE_API_TOKEN\`."
            echo "Optionally configure \`APPETIZE_PUBLIC_KEY\` to update one stable Appetize app instead of creating a new app per upload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DRXApp-xcresult-${{ github.run_id }}
          path: ${{ runner.temp }}/DRXAppTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload derived logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DRXApp-build-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/DerivedData/Logs
          if-no-files-found: ignore
          retention-days: 7
