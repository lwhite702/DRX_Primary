# Runs only when canonical customer-facing copy changes.
name: Copy Voice Gate

on:
  push:
    branches: [main, development, staging]
    paths:
      - "CHANGELOG.md"
      - "docs/BRAND_VOICE.md"
      - "app-docs/**"
      - "docs/featurebase/**"
      - "docs/mintlify/**"
      - "mintlify/**"
      - "docs/content/**"
      - "packages/content/**"
      - "apps/app/lib/copy/**"
      - "apps/app/components/layout/**"
      - "apps/app/lib/privacy/profiles.ts"
      - "apps/app/components/onboarding/steps/PrivacyStep.tsx"
      - "apps/marketing/**"
      - "apps/mobile/**"
      - "apps/ios/DRXApp/**"
      - "scripts/copy-lint.js"
      - "scripts/content/generate-swift-copy.mjs"
      - ".github/workflows/copy-voice.yml"
  pull_request:
    branches: [main, development, staging]
    paths:
      - "CHANGELOG.md"
      - "docs/BRAND_VOICE.md"
      - "app-docs/**"
      - "docs/featurebase/**"
      - "docs/mintlify/**"
      - "mintlify/**"
      - "docs/content/**"
      - "packages/content/**"
      - "apps/app/lib/copy/**"
      - "apps/app/components/layout/**"
      - "apps/app/lib/privacy/profiles.ts"
      - "apps/app/components/onboarding/steps/PrivacyStep.tsx"
      - "apps/marketing/**"
      - "apps/mobile/**"
      - "apps/ios/DRXApp/**"
      - "scripts/copy-lint.js"
      - "scripts/content/generate-swift-copy.mjs"
      - ".github/workflows/copy-voice.yml"

concurrency:
  group: copy-voice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copy-voice:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check generated iOS copy
        run: node --experimental-strip-types scripts/content/generate-swift-copy.mjs --check
      - name: Check cross-surface copy
        run: node scripts/copy-lint.js
