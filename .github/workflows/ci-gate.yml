name: CI Gate

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app_related: ${{ steps.filter.outputs.app_related }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app_related:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - '.github/workflows/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            docs_only:
              - 'mintlify/**'
              - 'docs/**'

  repo-audit:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:matrix
      - run: pnpm test:matrix:validate
      - run: pnpm test:policy
      - run: pnpm test:surfaces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-audit
          path: |
            docs/testing/REPO_AUDIT.json
            docs/testing/TEST_MATRIX.md
            docs/testing/TEST_MATRIX.json

  lint:
    runs-on: ubuntu-latest
    needs: [repo-audit, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    needs: [repo-audit, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit
          path: |
            apps/app/coverage

  integration:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, changes]
    if: needs.changes.outputs.app_related == 'true'
    strategy:
      fail-fast: true
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: PLAYWRIGHT_SHARD=${{ matrix.shard }} pnpm test:e2e:web:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-web-${{ matrix.shard }}
          path: |
            apps/app/playwright-report
            apps/app/test-results

  a11y:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y
          path: |
            apps/app/playwright-report
            apps/app/test-results

  security:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security
          path: |
            docs/testing/SECURITY_SCAN.json
            docs/testing/SECURITY_SCAN.junit.xml

  perf-smoke:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: docs/testing/PERF_SMOKE.json

  coverage-gate:
    runs-on: ubuntu-latest
    needs: [unit, changes]
    if: needs.changes.outputs.app_related == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:coverage

  report:
    runs-on: ubuntu-latest
    if: always()
    needs: [repo-audit, lint, typecheck, build, unit, integration, e2e-web, a11y, security, perf-smoke, coverage-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:readiness || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-report
          path: |
            docs/testing/PRODUCTION_READINESS_REPORT.md
            docs/testing/SUMMARY.md
            docs/testing/BETA_LAUNCH_CHECKLIST.md
            docs/testing/FULL_GATE_RESULTS.json
            docs/testing/DATA_INTEGRITY.json
