name: CI Gate

on:
  pull_request:
    branches: [main, development, staging]
  push:
    branches: [main, development, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Validate CI routing and failure handling
        run: node --test scripts/testing/ci-policy.test.mjs
      - name: Classify complete PR diff
        id: scope
        run: node scripts/testing/ci-change-scope.mjs
      - name: Check release integrity for every change
        run: |
          node scripts/release/integrity-check.mjs
          node scripts/release/test-integrity.mjs
          node scripts/release/test-verify.mjs
          node scripts/featurebase/test-import-content.mjs

  # One dependency installation for the preflight, audit, lint/typecheck,
  # build, and inexpensive runtime gates. Each command remains blocking.
  quality:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      # Preflight performs the frozen install; do not install a second time.
      - run: pnpm release:preflight
      - run: pnpm test:matrix
      - run: pnpm test:policy
      - run: pnpm test:repo-hygiene
      - run: pnpm test:marketing-claims
      - run: pnpm test:env-contract
      - run: pnpm --filter deelrxcrm-app test:flags:parity
      - run: pnpm --filter deelrxcrm-app verify:migration-rollbacks
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter deelrxcrm-app test:required:auth-data
      - run: pnpm test:integration
      - run: pnpm test:security
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: repo-audit
          retention-days: 7
          path: |
            docs/testing/REPO_AUDIT.json
            docs/testing/TEST_MATRIX.md
            docs/testing/TEST_MATRIX.json
            docs/testing/SECURITY_SCAN.json
            docs/testing/PERF_SMOKE.json

  unit:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Run the full suite once: same coverage as both former shards, one setup.
      - run: pnpm --filter deelrxcrm-app exec vitest run
      - run: pnpm --filter deelrxcrm-marketing test
      - run: pnpm test:coverage:strict

  required-ux:
    outputs:
      e2e-web: ${{ steps.quick_pos.outcome }}
      a11y: ${{ steps.advisory_a11y.outcome }}
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:e2e:install:ci
      - run: pnpm test:e2e:required
      - run: pnpm --filter deelrxcrm-app test:e2e:visual:required
      - run: pnpm test:a11y:required
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: required-ux
          retention-days: 7
          path: |
            apps/app/playwright-report
            apps/app/test-results
      # Preserve the existing advisory checks, reusing dependencies/browsers.
      - run: pnpm --filter deelrxcrm-app test:e2e:quick-pos-smoke
        id: quick_pos
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-web
          retention-days: 7
          path: |
            apps/app/playwright-report
            apps/app/test-results
      - run: pnpm test:a11y
        id: advisory_a11y
        continue-on-error: true

  auth-e2e:
    runs-on: ubuntu-latest
    needs: [changes, quality]
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 30
    steps:
      - name: Check auth E2E secret availability
        id: auth_guard
        env:
          CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -n "${CLERK_TESTING_TOKEN}" ] && [ -n "${CLERK_SECRET_KEY}" ] && { [ -n "${CLERK_PUBLISHABLE_KEY}" ] || [ -n "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.auth_guard.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.auth_guard.outputs.enabled == 'true'
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        if: steps.auth_guard.outputs.enabled == 'true'
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.auth_guard.outputs.enabled == 'true'
      - run: pnpm --filter deelrxcrm-app test:e2e:install:ci
        if: steps.auth_guard.outputs.enabled == 'true'
      - run: pnpm test:e2e:auth
        if: steps.auth_guard.outputs.enabled == 'true'
        env:
          E2E_REQUIRE_AUTH: "1"
          CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: steps.auth_guard.outputs.enabled == 'true' && !cancelled()
        with:
          name: auth-e2e
          retention-days: 7
          path: |
            apps/app/playwright-report
            apps/app/test-results

  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ !cancelled() }}
    needs: [changes, quality, unit, required-ux, auth-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      # The report uses Node built-ins only: no dependency installation.
      - name: Aggregate required CI job results
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_SCOPE: ${{ needs.changes.outputs.scope }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/testing/ci-aggregate-report.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: readiness-report
          retention-days: 7
          path: |
            docs/testing/CI_AGGREGATE_REPORT.md
            docs/testing/CI_AGGREGATE_REPORT.json
