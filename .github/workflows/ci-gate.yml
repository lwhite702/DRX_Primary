name: CI Gate

on:
  pull_request:
    branches: [main, development, staging]
  push:
    branches: [main, development, staging]

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:matrix
      - run: pnpm test:policy
      - run: pnpm test:repo-hygiene
      - run: pnpm test:marketing-claims
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repo-audit
          path: |
            docs/testing/REPO_AUDIT.json
            docs/testing/TEST_MATRIX.md
            docs/testing/TEST_MATRIX.json

  preflight:
    runs-on: ubuntu-latest
    needs: repo-audit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm release:preflight
      - run: pnpm test:env-contract

      - run: pnpm --filter deelrxcrm-app test:flags:parity
      - run: pnpm --filter deelrxcrm-app verify:migration-rollbacks

  lint:
    runs-on: ubuntu-latest
    needs: [repo-audit, preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    needs: [repo-audit, preflight]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  unit:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.shard }}
          path: |
            apps/app/coverage

  required-auth-data:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:required:auth-data

  required-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:e2e:install:ci
      - run: pnpm test:e2e:required
      - run: pnpm --filter deelrxcrm-app test:e2e:visual:required
      - run: pnpm test:a11y:required
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-ux
          path: |
            apps/app/playwright-report
            apps/app/test-results

  integration:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e-web:
    runs-on: ubuntu-latest
    # Non-blocking companion run for the required Quick POS flow. The broader
    # deterministic release suite remains blocking in required-ux.
    continue-on-error: true
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:e2e:install:ci
      - run: pnpm --filter deelrxcrm-app test:e2e:quick-pos-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-web
          path: |
            apps/app/playwright-report
            apps/app/test-results

  a11y:
    runs-on: ubuntu-latest
    # Non-blocking while this suite is being stabilized; required UX gates remain blocking.
    continue-on-error: true
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:e2e:install:ci
      - run: pnpm test:a11y

  auth-e2e:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check auth E2E secret availability
        id: auth_guard
        env:
          CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: |
          if [ -n "${CLERK_TESTING_TOKEN}" ] && [ -n "${CLERK_SECRET_KEY}" ] && { [ -n "${CLERK_PUBLISHABLE_KEY}" ] || [ -n "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.auth_guard.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.auth_guard.outputs.enabled == 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        if: steps.auth_guard.outputs.enabled == 'true'
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.auth_guard.outputs.enabled == 'true'
      - run: pnpm --filter deelrxcrm-app test:e2e:install:ci
        if: steps.auth_guard.outputs.enabled == 'true'
      - run: pnpm test:e2e:auth
        if: steps.auth_guard.outputs.enabled == 'true'
        env:
          E2E_REQUIRE_AUTH: "1"
          CLERK_TESTING_TOKEN: ${{ secrets.CLERK_TESTING_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: steps.auth_guard.outputs.enabled == 'true' && always()
        with:
          name: auth-e2e
          path: |
            apps/app/playwright-report
            apps/app/test-results

  security:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security
          path: docs/testing/SECURITY_SCAN.json

  perf-smoke:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: docs/testing/PERF_SMOKE.json

  coverage-gate:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter deelrxcrm-app test:coverage

  report:
    runs-on: ubuntu-latest
    if: always()
    needs: [repo-audit, preflight, lint, typecheck, build, required-auth-data, required-ux, unit, integration, e2e-web, a11y, auth-e2e, security, perf-smoke, coverage-gate]
    steps:
      - name: Summarize authoritative CI jobs
        shell: bash
        env:
          REPO_AUDIT_RESULT: ${{ needs['repo-audit'].result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TYPECHECK_RESULT: ${{ needs.typecheck.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          REQUIRED_AUTH_DATA_RESULT: ${{ needs['required-auth-data'].result }}
          REQUIRED_UX_RESULT: ${{ needs['required-ux'].result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          AUTH_E2E_RESULT: ${{ needs['auth-e2e'].result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PERF_SMOKE_RESULT: ${{ needs['perf-smoke'].result }}
          COVERAGE_GATE_RESULT: ${{ needs['coverage-gate'].result }}
          E2E_WEB_RESULT: ${{ needs['e2e-web'].result }}
          A11Y_RESULT: ${{ needs.a11y.result }}
        run: |
          required_jobs=(
            "repo-audit:${REPO_AUDIT_RESULT}"
            "preflight:${PREFLIGHT_RESULT}"
            "lint:${LINT_RESULT}"
            "typecheck:${TYPECHECK_RESULT}"
            "build:${BUILD_RESULT}"
            "required-auth-data:${REQUIRED_AUTH_DATA_RESULT}"
            "required-ux:${REQUIRED_UX_RESULT}"
            "unit:${UNIT_RESULT}"
            "integration:${INTEGRATION_RESULT}"
            "auth-e2e:${AUTH_E2E_RESULT}"
            "security:${SECURITY_RESULT}"
            "perf-smoke:${PERF_SMOKE_RESULT}"
            "coverage-gate:${COVERAGE_GATE_RESULT}"
          )
          advisory_jobs=(
            "e2e-web:${E2E_WEB_RESULT}"
            "a11y:${A11Y_RESULT}"
          )
          summary="ci-gate-summary.md"
          failed=0

          printf '# CI Gate Summary\n\nThis report aggregates the authoritative jobs above; it does not rerun them in a differently configured runner.\n\n## Required jobs\n' > "${summary}"
          for entry in "${required_jobs[@]}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            printf -- '- %s: %s\n' "${name}" "${result}" >> "${summary}"
            if [ "${result}" != "success" ]; then
              failed=1
            fi
          done

          printf '\n## Advisory jobs\n' >> "${summary}"
          for entry in "${advisory_jobs[@]}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            printf -- '- %s: %s\n' "${name}" "${result}" >> "${summary}"
          done

          printf '\nThis CI summary is source/build evidence only. Credentialed production runtime and physical-device verification remain separate release gates.\n' >> "${summary}"
          sed -n '1,200p' "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          exit "${failed}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-gate-summary
          path: ci-gate-summary.md
