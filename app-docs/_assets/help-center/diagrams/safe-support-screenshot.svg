<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Prepare a safe support screenshot</title><desc id="desc">A four-step flow to replace private data, crop the image, check it, and share only through the approved support channel.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <text x="64" y="76" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Prepare a safe support screenshot</text><text x="64" y="112" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" text-anchor="start">REPLACE PRIVATE DATA BEFORE CAPTURE</text><g><rect x="64" y="210" width="260" height="230" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="94" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">1  Replace</text><text x="94" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Use fictional records</text><text x="94" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">No codes or credentials</text></g><path d="M 344 325 L 404 325" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="424" y="210" width="260" height="230" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="454" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">2  Crop</text><text x="454" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Keep the error</text><text x="454" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Remove unrelated records</text></g><path d="M 704 325 L 764 325" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="784" y="210" width="260" height="230" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="814" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">3  Check</text><text x="814" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Read every visible field</text><text x="814" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Check image metadata</text></g><path d="M 1064 325 L 1124 325" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="1144" y="210" width="192" height="230" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="1174" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">4  Share</text><text x="1174" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Approved private</text><text x="1174" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">support channel</text></g><g><rect x="64" y="520" width="1272" height="160" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="94" y="568" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Never include</text><text x="94" y="608" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Passwords, verification codes, customer details, payment credentials, or unrestricted business records</text></g>
  </svg>