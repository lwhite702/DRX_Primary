<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Uncertain checkout or payment result</title><desc id="desc">Check for the saved order or payment before asking for payment again or submitting another record.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <text x="64" y="76" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">The result is uncertain</text><text x="64" y="112" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" text-anchor="start">DO NOT ASK FOR PAYMENT AGAIN YET</text><g><rect x="64" y="210" width="350" height="220" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="94" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Check Orders &amp; Receipts</text><text x="94" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Look for the sale</text><text x="94" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and its total</text></g><path d="M 434 320 L 514 320" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="534" y="210" width="350" height="220" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="564" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Check Store Credit</text><text x="564" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Look for the payment</text><text x="564" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and remaining balance</text></g><path d="M 904 320 L 984 320" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="1004" y="210" width="332" height="220" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="1034" y="258" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Choose one next step</text><text x="1034" y="298" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Found: do not retry</text><text x="1034" y="336" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Missing: contact support</text></g><g><rect x="170" y="540" width="1060" height="135" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="200" y="588" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Keep the original records unchanged</text><text x="200" y="628" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">A selected payment method records what happened. It does not prove that money moved.</text></g>
  </svg>