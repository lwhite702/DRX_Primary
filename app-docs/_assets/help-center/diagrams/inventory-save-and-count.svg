<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Inventory save and count troubleshooting</title><desc id="desc">Check the active business, item, saved movement, and current count before submitting another inventory change.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <text x="64" y="76" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Inventory change did not look right</text><text x="64" y="112" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" text-anchor="start">CHECK THE SAVED RECORD BEFORE TRYING AGAIN</text><g><rect x="64" y="215" width="280" height="220" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="94" y="263" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">1  Business</text><text x="94" y="303" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Confirm the active</text><text x="94" y="341" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">business and location</text></g><path d="M 364 325 L 424 325" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="444" y="215" width="280" height="220" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="474" y="263" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">2  Item</text><text x="474" y="303" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Match product, SKU,</text><text x="474" y="341" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">lot, and quantity</text></g><path d="M 744 325 L 804 325" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="824" y="215" width="280" height="220" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="854" y="263" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">3  Movement</text><text x="854" y="303" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Look for the saved</text><text x="854" y="341" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">intake or adjustment</text></g><path d="M 1124 325 L 1184 325" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="1204" y="215" width="132" height="220" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="1234" y="263" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">4  Count</text><text x="1234" y="303" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Refresh</text><text x="1234" y="341" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">once</text></g><g><rect x="230" y="545" width="940" height="130" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="260" y="593" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">If the result is still uncertain</text><text x="260" y="633" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Stop. Keep the original records unchanged and ask an authorized manager to review them.</text></g>
  </svg>