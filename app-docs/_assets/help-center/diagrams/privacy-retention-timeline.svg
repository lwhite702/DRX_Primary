<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Privacy preset retention timeline</title><desc id="desc">Alias Mode defaults to 30 days, Standard Mode to 180 days, and Full Customer Mode to 365 days before qualifying inactive records are permanently deleted when cleanup runs.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <text x="64" y="76" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Default retention windows</text><text x="64" y="112" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" text-anchor="start">CLEANUP PERMANENTLY DELETES QUALIFYING INACTIVE RECORDS WHEN IT RUNS</text><g><rect x="64" y="190" width="370" height="180" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="94" y="238" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Alias Mode</text><text x="94" y="278" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">30 days</text></g><g><rect x="515" y="190" width="370" height="180" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="545" y="238" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Standard Mode</text><text x="545" y="278" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">180 days</text></g><g><rect x="966" y="190" width="370" height="180" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="996" y="238" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Full Customer Mode</text><text x="996" y="278" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">365 days</text></g><line x1="120" y1="480" x2="1250" y2="480" stroke="#343434" stroke-width="8" stroke-linecap="round"/><circle cx="260" cy="480" r="16" fill="#CCFF00"/><circle cx="700" cy="480" r="16" fill="#CCFF00"/><circle cx="1140" cy="480" r="16" fill="#CCFF00"/><text x="260" y="530" fill="#F5F5F5" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="1.2" text-anchor="middle">30 DAYS</text><text x="700" y="530" fill="#F5F5F5" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="1.2" text-anchor="middle">180 DAYS</text><text x="1140" y="530" fill="#F5F5F5" font-family="Menlo, Consolas, monospace" font-size="20" letter-spacing="1.2" text-anchor="middle">365 DAYS</text><g><rect x="275" y="610" width="850" height="120" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="305" y="658" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Before changing a preset</text><text x="305" y="698" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Check balances, required holds, and the saved cleanup settings.</text></g>
  </svg>