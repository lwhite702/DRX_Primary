  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <rect x="0" y="0" width="300" height="800" fill="#0D0D0D"/><circle cx="52" cy="58" r="13" fill="#CCFF00"/><text x="78" y="68" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">DRX</text><text x="40" y="104" fill="#F59E0B" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" text-anchor="start">BETA</text><rect x="40" y="128" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="157" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Dashboard</text><rect x="40" y="186" width="220" height="44" rx="8" fill="#CCFF00"/><text x="58" y="215" fill="#0A0A0A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Orders &amp; Receipts</text><rect x="40" y="244" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="273" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Point of Sale</text><rect x="40" y="302" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="331" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Inventory</text><rect x="40" y="360" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="389" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Customers</text><rect x="40" y="418" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="447" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Store Credit</text><rect x="40" y="476" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="505" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Reports</text><rect x="40" y="534" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="563" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Settings</text><text x="330" y="58" fill="#CCFF00" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" text-anchor="start">ILLUSTRATIVE SCREEN · FICTIONAL DATA</text><text x="330" y="108" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start">Sales and deliveries</text><g><rect x="330" y="150" width="470" height="250" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="360" y="198" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Sale</text><text x="360" y="238" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Order DRX-1054</text><text x="360" y="276" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Status · Completed</text><text x="360" y="314" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Total · $84.00</text></g><g><rect x="830" y="150" width="520" height="250" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="860" y="198" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Delivery details</text><text x="860" y="238" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Address · Fictional</text><text x="860" y="276" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Status · Ready</text><text x="860" y="314" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Expense · $8.00</text></g><path d="M 800 275 L 830 275" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="330" y="440" width="1020" height="230" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="360" y="488" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Update an enabled delivery task</text><text x="360" y="528" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Confirm the sale before changing delivery details.</text><text x="360" y="566" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Do not create another sale for the same delivery.</text></g>
