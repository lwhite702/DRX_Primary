<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Sales and deliveries</title><desc id="desc">Sales and deliveries, an illustrative DRX screen using fictional data.</desc>
