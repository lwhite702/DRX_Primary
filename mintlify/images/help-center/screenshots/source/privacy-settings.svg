<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Privacy Protocol Dashboard</title><desc id="desc">Privacy Protocol Dashboard, an illustrative DRX screen using fictional data.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <rect x="0" y="0" width="300" height="800" fill="#0D0D0D"/><circle cx="52" cy="58" r="13" fill="#CCFF00"/><text x="78" y="68" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="start">DRX</text><text x="40" y="104" fill="#F59E0B" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" text-anchor="start">BETA</text><rect x="40" y="128" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="157" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Dashboard</text><rect x="40" y="186" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="215" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Orders &amp; Receipts</text><rect x="40" y="244" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="273" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Point of Sale</text><rect x="40" y="302" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="331" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Inventory</text><rect x="40" y="360" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="389" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Customers</text><rect x="40" y="418" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="447" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Store Credit</text><rect x="40" y="476" width="220" height="44" rx="8" fill="transparent"/><text x="58" y="505" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500" text-anchor="start">Reports</text><rect x="40" y="534" width="220" height="44" rx="8" fill="#CCFF00"/><text x="58" y="563" fill="#0A0A0A" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start">Settings</text><text x="330" y="58" fill="#CCFF00" font-family="Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" text-anchor="start">ILLUSTRATIVE SCREEN · FICTIONAL DATA</text><text x="330" y="108" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start">Privacy Protocol Dashboard</text><g><rect x="330" y="145" width="320" height="165" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="360" y="193" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Alias Mode</text><text x="360" y="233" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Aliases only · 30 days</text></g><g><rect x="675" y="145" width="320" height="165" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="705" y="193" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Standard Mode</text><text x="705" y="233" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Optional contact · 180 days</text></g><g><rect x="1020" y="145" width="330" height="165" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="1050" y="193" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Full Customer Mode</text><text x="1050" y="233" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Full details · 365 days</text></g><g><rect x="330" y="345" width="1020" height="345" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="360" y="393" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Retention cleanup</text><text x="360" y="433" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Enable retention cleanup</text><text x="360" y="471" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Days · 180</text><text x="360" y="509" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Frequency · Weekly</text><text x="360" y="547" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Local hour (0-23) · 2</text><text x="360" y="585" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Hard delete inactive records</text></g><rect x="1020" y="615" width="300" height="56" rx="8" fill="#CCFF00"/><text x="1170" y="650" fill="#0A0A0A" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Save Settings</text>
  </svg>