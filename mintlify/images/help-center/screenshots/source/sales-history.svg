or="start">Total                    $108.25</text></g><g><rect x="330" y="650" width="1020" height="90" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="360" y="698" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Check the saved record before making a correction</text></g>
