<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Barcode scanner keyboard-input path</title><desc id="desc">A scanner sends a product code like a keyboard, the active field receives it, and DRX matches the code to a product.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <text x="64" y="76" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">How a keyboard-style scanner works</text><text x="64" y="112" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" text-anchor="start">TEST WITH A NON-SALE FIELD FIRST</text><g><rect x="64" y="220" width="310" height="220" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="94" y="268" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Scanner</text><text x="94" y="308" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Reads the barcode</text><text x="94" y="346" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">and sends characters</text></g><path d="M 394 330 L 484 330" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="504" y="220" width="310" height="220" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="534" y="268" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Active field</text><text x="534" y="308" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Receives the code</text><text x="534" y="346" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">like keyboard input</text></g><path d="M 834 330 L 924 330" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="944" y="220" width="392" height="220" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="974" y="268" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">DRX product match</text><text x="974" y="308" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Correct code: item found</text><text x="974" y="346" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">No match: check product code</text></g><g><rect x="210" y="545" width="980" height="130" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="240" y="593" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Before using it during a sale</text><text x="240" y="633" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Confirm the full code appears once and the matched product is correct.</text></g>
  </svg>