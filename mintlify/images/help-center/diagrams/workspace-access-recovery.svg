<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Workspace and access recovery flow</title><desc id="desc">Check the invited account, active business, and required permission before asking the owner or private support for help.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#202020" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CCFF00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#0A0A0A"/><rect width="100%" height="100%" fill="url(#grid)" opacity="0.35"/>
  <text x="64" y="76" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Access problem</text><text x="64" y="112" fill="#A3A3A3" font-family="Menlo, Consolas, monospace" font-size="18" letter-spacing="1.2" text-anchor="start">KEEP USING YOUR OWN ACCOUNT</text><g><rect x="64" y="230" width="270" height="210" rx="14" fill="#121212" stroke="#CCFF00" stroke-width="2"/><text x="94" y="278" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Invited account?</text><text x="94" y="318" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Use the account tied</text><text x="94" y="356" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">to the invitation</text></g><path d="M 354 335 L 414 335" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="434" y="230" width="270" height="210" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="464" y="278" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Right business?</text><text x="464" y="318" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Confirm the active</text><text x="464" y="356" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">business name</text></g><path d="M 724 335 L 784 335" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="804" y="230" width="270" height="210" rx="14" fill="#121212" stroke="#343434" stroke-width="2"/><text x="834" y="278" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Permission?</text><text x="834" y="318" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Read the access</text><text x="834" y="356" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">message</text></g><path d="M 1094 335 L 1154 335" stroke="#CCFF00" stroke-width="4" fill="none" marker-end="url(#arrow)"/><g><rect x="1174" y="230" width="162" height="210" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="1204" y="278" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Still blocked</text><text x="1204" y="318" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Ask owner</text><text x="1204" y="356" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">or support</text></g><g><rect x="180" y="540" width="1040" height="140" rx="14" fill="#121212" stroke="#F59E0B" stroke-width="2"/><text x="210" y="588" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="start">Do not work around access</text><text x="210" y="628" fill="#A3A3A3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Do not create a duplicate owner account, share a login, or use another business as a substitute.</text></g>
  </svg>