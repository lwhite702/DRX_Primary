name: DRXApp
options:
  bundleIdPrefix: com.wrelik
  deploymentTarget:
    iOS: "17.0"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  DRXApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    sources:
      - path: DRXApp
    settings:
      base:
        PRODUCT_NAME: Deelrx CRM
        PRODUCT_MODULE_NAME: DRXApp
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx
        CODE_SIGN_ENTITLEMENTS: DRXApp/DRXApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DRXApp/Info.plist
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
    scheme:
      testTargets:
        - DRXAppTests
        - DRXAppUITests
  DRXAppTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    sources:
      - path: DRXAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Deelrx CRM.app/Deelrx CRM
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: DRXApp
  DRXAppUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    sources:
      - path: DRXAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DRXApp
