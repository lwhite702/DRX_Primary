name: DRXApp
options:
  bundleIdPrefix: com.wrelik
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  DRXApp:
    type: application
    platform: iOS
    sources:
      - path: DRXApp
    settings:
      base:
        PRODUCT_NAME: DRX
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DRX
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    scheme:
      testTargets:
        - DRXAppTests
        - DRXAppUITests
  DRXAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DRXAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DRXApp
  DRXAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DRXAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DRXApp
