name: DRXApp
options:
  bundleIdPrefix: com.wrelik
  deploymentTarget:
    iOS: "17.0"
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios.git
    exactVersion: 3.64.6
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 9.21.0
  Convex:
    url: https://github.com/get-convex/convex-swift.git
    from: 0.5.0
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: L8R42BJ54K
    CODE_SIGN_STYLE: Automatic
    VERSIONING_SYSTEM: apple-generic
    CURRENT_PROJECT_VERSION: 31
    MARKETING_VERSION: 0.6.1
targets:
  DRXApp:
    type: application
    platform: iOS
    productName: Deelrx CRM
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    sources:
      - path: DRXApp
        excludes:
          - ClerkEnvironment.json
    settings:
      base:
        PRODUCT_NAME: Deelrx CRM
        PRODUCT_MODULE_NAME: DRXApp
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: DRXApp/DRXApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DRXApp/Info.plist
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: PostHog
        product: PostHog
      - package: Sentry
        product: Sentry
      - package: Convex
        product: ConvexMobile
    scheme:
      testTargets:
        - DRXAppTests
        - DRXAppUITests
  DRXAppTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    sources:
      - path: DRXAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Deelrx CRM.app/Deelrx CRM
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: DRXApp
  DRXAppUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    sources:
      - path: DRXAppUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wrelik.drx.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DRXApp
